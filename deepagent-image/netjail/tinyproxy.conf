# NetJail egress proxy config. Domain allowlist is enforced via the Filter file
# generated at run time from netjail/allowed-domains.txt; anything not matched is
# denied (FilterDefaultDeny Yes). See netjail/README.md.
#
# NOTE: directive support (User/Group/PidFile paths) varies by proxy image. If
# the proxy container crashes on start, check `docker logs deepagent-proxy` and
# adjust the paths below for your NETJAIL_PROXY_IMAGE.

Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 50
LogLevel Warning
PidFile "/tmp/tinyproxy.pid"

# Allow HTTPS CONNECT tunnels - git, pip, npm are all HTTPS. Add 22 here (and the
# host in allowed-domains.txt) only if you deliberately allow git-over-SSH.
ConnectPort 443

# Who may USE the proxy. Only the jail + egress networks can reach it, and the
# jail has no other route out, so any-source is safe here.
Allow 0.0.0.0/0

# Host allowlist. FilterDefaultDeny denies every host the filter does not match.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
# FilterExtended selects extended-regex (ERE) filter patterns, which the generated
# filter relies on (the `(^|\.)` anchors). Newer tinyproxy renamed this to
# `FilterType ere` and warns on FilterExtended, but still honors it; kept as-is for
# compatibility with older proxy images. Switch to `FilterType ere` if your image
# has dropped FilterExtended.
FilterExtended On
FilterCaseSensitive Off
