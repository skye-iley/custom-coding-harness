# LM Studio: OpenAI-compatible, local, keyless (needs LMSTUDIO_BASE_URL).
# No default model pinned yet — set DEEPAGENTS_MODEL=lmstudio:<model> explicitly.
# Local/self-hosted: no API charge (cost=0). Energy trackable per-model via an
# [energy] table; measured device energy specced (not built) in docs/milestones/ENERGY_SPEC.md.
api_key_env = "LMSTUDIO_API_KEY"
requires_key = false
priority = 6
# default_model =
# prefix =
base_url_env = "LMSTUDIO_BASE_URL"
pricing = "free"
