name = "gemma4"

# Ollama's default auto-selected model (see ../provider.toml). The id is an
# Ollama *tag* as `ollama list` reports it, so a locally-tagged variant needs its
# own file here before `DEEPAGENTS_MODEL=ollama:gemma4:harnesstest1` is a *known*
# spec. A tag contains a colon, which Windows forbids in a filename — so name the
# file freely and set `name` to the real tag (the loader prefers `name` over the
# file stem): `gemma4-harnesstest1.toml` holding `name = "gemma4:harnesstest1"`.
# An unknown spec still runs — validate_credentials passes it through to
# init_chat_model with a note — it just carries no rates and no metadata.

# Model metadata (commented = not recorded).
# display_name =
# For a local Ollama tag the usable window IS the num_ctx below, not the weights'
# architectural maximum: the daemon truncates to num_ctx regardless. Keep the two
# numbers equal -- raising one without the other makes this metadata a lie.
context_window = 65536
# output_token_limit =

# Local/self-hosted: no API charge. provider.toml declares pricing = "free", so
# no [pricing] table applies here — cost is 0 by strategy, not by empty rates.

# Client kwargs passed verbatim to the chat model constructor. For Ollama these
# override the tag's Modelfile PARAMETER block per request, so ONE tag serves every
# context size -- no `ollama create` per variant.
#
# num_ctx is the real ceiling on a turn (system prompt + AGENTS.md + history + tool
# schemas + tool results). Ollama's own default is far below what a coding agent
# needs. 65536 measured at ~5.4 GB VRAM for this model on an 8 GB card, fully on
# GPU; 131072 measured ~6.4 GB, also fully on GPU. Cost is ~17 MiB per 1K tokens on
# a ~4.3 GB base. Raise it if you have the VRAM -- but check `ollama ps` still says
# `100% GPU`, because exceeding VRAM offloads layers to CPU and throughput falls off
# a cliff rather than degrading smoothly -- and update `context_window` above to match.
#
# reasoning = true sends Ollama `think: true`. Required, and NOT interchangeable
# with `false` or with leaving it unset -- all three behave differently here.
#
# Measured 2026-08-17 (milestone7.md sec 3.1/3.2). This tag reasons by default
# (1389 chars of `thinking` against 995 of content on a plain prompt), and
# langchain-ollama 1.1.0 captures Ollama's `message.thinking` ONLY behind a truthy
# `reasoning` guard:
#
#     if reasoning and (thinking_content := stream_resp["message"].get("thinking")):
#         additional_kwargs["reasoning_content"] = thinking_content
#
#   unset  -- the model reasons, the client DISCARDS the result. Usually that just
#            loses the reasoning; when the model puts all of its output in
#            thinking, `content` is empty and the turn renders blank with no error
#            anywhere. This is the bug that started the investigation.
#   false  -- no tokens are lost, but the model loses the channel it plans in, and
#            AGENTIC TOOL USE BREAKS. Measured on the real 11-tool agent: zero
#            structured tool calls, and the model either asks the user for an
#            absolute path or emits pseudo-syntax as prose (`ls {path: "."}`).
#            A one-tool probe still passes, which is how this hid at first.
#   true   -- thinking is captured into `additional_kwargs["reasoning_content"]`
#            rather than dropped, `content` carries the answer, and the same
#            prompt returns a correct structured `ls` call. This is the setting.
#
# So the two failure modes pull in opposite directions and only `true` satisfies
# both. Do not "simplify" this to false, and do not delete the line -- unset is
# the silent-drop state, not a neutral default.
[options]
num_ctx = 65536
reasoning = true

# Watt-hours per token (optional estimate; tracked even for free models).
[energy]
# per_input_token =
# per_output_token =
# source =
