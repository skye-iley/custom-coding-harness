# A locally-tagged gemma4 variant (`ollama create gemma4:harnesstest1`). The file
# stem is free-form because a tag contains a colon and Windows forbids that in a
# filename; `name` below carries the real tag and the loader prefers it over the
# stem (see gemma4.toml).
name = "gemma4:harnesstest1"

# Matches this tag's Modelfile `PARAMETER num_ctx 32768`. The harness cannot read a
# Modelfile -- it knows only this registry -- so without this file the tag carried no
# metadata at all and `context_window` was simply unknown. num_ctx is restated in
# [options] below so the two can't drift: metadata that disagrees with the request is
# a lie, and the request is what the daemon obeys.
context_window = 32768

[options]
num_ctx = 32768

# reasoning = true sends Ollama `think: true`. See gemma4.toml for the full
# three-way measurement; the short version, because all three states differ:
#
#   unset  -- model reasons, langchain-ollama 1.1.0 DISCARDS `message.thinking`
#             (its capture is behind a truthy `reasoning` guard). 450 output
#             tokens produced, content="", additional_kwargs={}, blank REPL turn,
#             no error. The bug that started the investigation.
#   false  -- nothing is lost, but agentic TOOL USE BREAKS: measured on the real
#             11-tool agent, zero structured tool calls and `ls {path: "."}`
#             emitted as prose instead. The model plans in the thinking channel.
#   true   -- thinking captured to additional_kwargs, content carries the answer,
#             and the same prompt returns a correct structured `ls` call.
#
# Scope is per-tag, not per-provider: whether a tag reasons by default is a
# property of the tag, and `llama3.1` (measured) emits no thinking field at all,
# so a provider-wide setting would be changing some models blind.
reasoning = true

# Local/self-hosted: provider.toml declares pricing = "free", so no [pricing] table.

