name: ci
on: [push, pull_request]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest
      # The WHOLE directory, deliberately — not a hand-picked file list.
      #
      # This step used to enumerate 15 files, and the list had already drifted from
      # the suite it was meant to describe: test_sync_models / test_loaders /
      # test_import_isolation are documented host-tier in deepagent-image/CLAUDE.md
      # and were absent here, along with test_config, test_hitl, test_memadmin,
      # test_refresh, test_workflows and more. Measured at the time of this change:
      # the list ran 407 tests where the directory runs 653 on the same pytest-only
      # environment. 246 host-runnable tests were reaching CI only through the much
      # slower image job — and a newly added host-tier file joined them silently,
      # since nothing failed when the author forgot to extend the list.
      #
      # What makes the directory safe here is `pytest.importorskip(...)` at the top
      # of every module that needs the runtime stack: on this job (pytest and
      # nothing else) they report SKIPPED, not errors. That is the same guard the
      # suite conventions already require, so this step now *enforces* the
      # convention instead of duplicating a stale copy of its results.
      #
      # Consequence to accept on purpose: a new test that imports langchain without
      # a guard turns this job red. That is the intended signal — the alternative is
      # the silent under-coverage above. Fix it by adding the guard (module-level
      # importorskip, or per-test when the rest of the module is pure, as
      # test_hitl.py does), never by re-introducing a file list here.
      #
      # -ra so the skip reasons are on the record: a green run here is only
      # meaningful alongside what it skipped.
      - run: python -m pytest tests/ -ra
        working-directory: deepagent-image/project
      # M4 slice H invariant 31 (the vendored seccomp profile must stay Docker's
      # default plus exactly five relaxed syscalls, so a swap to `seccomp=unconfined`
      # or a quietly widened relaxation fails the build) is asserted by
      # tests/test_seccomp.py::test_committed_profile_is_narrow and
      # ::test_committed_profile_still_gates_the_dangerous_syscalls, which run in the
      # pytest step above against the committed artifact.
      #
      # There was a separate `python -m harness seccomp-sync --check` step here. It
      # never passed: importing the `harness` package runs harness/__init__.py, which
      # eagerly imports harness.cli -> dotenv, langgraph, ... none of which this job
      # installs (deliberately — the host tier is stdlib-only, see the suite
      # conventions in deepagent-image/CLAUDE.md). Installing the runtime dependency
      # tree just to reach a check the test suite already makes is the wrong trade, so
      # the step is gone rather than papered over. The tests are the gate.
      #
      # M4 slice J invariant 38 is the LSM twin of the above and rides the same step:
      # tests/test_apparmor.py::test_committed_profile_is_narrow asserts the committed
      # apparmor/deepagent-userns is docker-default plus exactly our mount diff, and
      # ::test_committed_baseline_is_reproducible_from_the_pinned_template asserts the
      # diff base was not quietly weakened to match a widened profile. Both are offline
      # and need no AppArmor kernel, which is why they belong in the host tier.
  apparmor-load-probe:
    # MEASUREMENT, NOT A GATE (milestone4.1.md §10 step 2 / fork J2). Slice J's spec
    # explicitly refuses to pin a CI jail gate on an assumption — the whole milestone
    # exists because slice H shipped "verified" on a host class that could not see the
    # AppArmor gate at all. So this job asks the question on the record: can a
    # GitHub-hosted runner load an AppArmor profile, and does the jail then start?
    #
    # continue-on-error until a run answers it. Then: if it loads, fold the install
    # into the `smoke` job and pin JAIL_CHECK=1 there (turning today's rc-77 skip into
    # a real red/green gate); if it does not, delete this job and record why beside the
    # smoke comment below. Either way the next edit here is driven by an observation.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t deepagent-harness deepagent-image
      - name: What confines a container here by default?
        run: |
          docker run --rm deepagent-harness sh -c \
            'cat /proc/self/attr/apparmor/current 2>/dev/null || cat /proc/self/attr/current 2>/dev/null || echo "(no LSM attr)"'
      - name: Load the narrowed profile into the runner kernel
        run: sudo deepagent-image/scripts/install-apparmor-profile.sh
      - name: Does the daemon accept it?
        run: docker run --rm --security-opt apparmor=deepagent-userns deepagent-harness true
      - name: Does the jail start under it?
        # systempaths=unconfined is the third gate (milestone4.1.md §13.7, fork J5):
        # with Docker's /proc masks in place the kernel refuses bwrap's fresh --proc
        # regardless of either profile. Mirrors what run-docker/smoke now pass under
        # DEEPAGENTS_JAIL=1 — without it this step measures the wrong thing.
        run: |
          docker run --rm -i \
            --security-opt seccomp=deepagent-image/seccomp/userns.json \
            --security-opt apparmor=deepagent-userns \
            --security-opt systempaths=unconfined \
            -e DEEPAGENTS_JAIL=1 \
            deepagent-harness python3 - < deepagent-image/scripts/jail-check.py
      - name: Control — with Docker's /proc masks left on, it must NOT start
        # Records the third gate on the runner too, and proves the step above is not
        # passing for some unrelated reason. Expected to report a `procfs` SKIP (rc 77);
        # never fails the job, since this is a measurement.
        continue-on-error: true
        run: |
          set +e
          docker run --rm -i \
            --security-opt seccomp=deepagent-image/seccomp/userns.json \
            --security-opt apparmor=deepagent-userns \
            -e DEEPAGENTS_JAIL=1 \
            deepagent-harness python3 - < deepagent-image/scripts/jail-check.py
          echo "control rc=$? (77 = skipped; expect the procfs reason)"
  image-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t deepagent-harness:test deepagent-image
      - run: docker run --rm deepagent-harness:test python3 -m pytest tests/
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t deepagent-harness deepagent-image
      # smoke.sh also runs the M4 slice H jail gate (bwrap must really unshare under
      # seccomp/userns.json, and a masked path must read empty inside the jail with no
      # docker mask in play). It SELF-SKIPS (rc 77) when the host cannot build the jail
      # for either environmental reason — nested userns refused, or the host LSM denying
      # bwrap's mounts.
      #
      # MEASURED on this runner: it skips, with reason `lsm`. ubuntu-latest applies
      # Docker's `docker-default` AppArmor profile, whose literal `deny mount,` blocks
      # bwrap at its first mount — *after* `unshare` succeeded, so seccomp is not the
      # constraint and no seccomp change fixes it. That is slice J (milestone4.md
      # §11.6). An earlier revision of this comment claimed the gate "cannot redden CI
      # environmentally"; it could and did, because the rc-77 path only recognized
      # userns refusals. It now recognizes both.
      #
      # Deliberately NOT pinned with JAIL_CHECK=1: on this runner that would pin a
      # failure, not the boundary. Pin it once slice J lands and a run shows
      # "M4 jail: ... ok" rather than "SKIPPED", so a regression that silently disables
      # the jail fails the build instead of quietly downgrading to a skip.
      - run: deepagent-image/scripts/smoke.sh
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: deepagent-image/scripts/check-parity.sh
